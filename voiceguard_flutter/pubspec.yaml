name: voiceguard_flutter
description: "VoiceGuard AI - Real-Time AI Deepfake Voice Detection & Call Protection App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  audioplayers: ^6.0.0
  record: ^5.1.2
  file_picker: ^8.1.2
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/samples/cloned_1.wav
    - assets/samples/cloned_2.wav
    - assets/samples/real_1.wav
    - assets/samples/real_2.wav
